[project]
name = "bestrag"
version = "0.1.0"
description = "企业知识库 RAG 框架"
requires-python = ">=3.12, <3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "pyyaml>=6.0",
    "filetype>=1.2",
    "python-magic>=0.4",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "httpx2>=2.7.0",
    "sentence-transformers>=3.0.0",
    "pymilvus>=2.4.0",
    "FlagEmbedding>=1.2.0",
    "numpy>=1.21.0",
    "sniffio>=1.3.1",
    "markitdown[all]>=0.1.5",
    "opendataloader-pdf>=2.5.0",
    "redis>=8.0.1",
    "rank-bm25>=0.2.2",
    "openai>=2.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
